<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Muse | Contacto</title>
  <meta name="description" content="Entre em contacto com a equipa do site da banda Muse. Envie sua mensagem através do formulário.">
  <meta name="keywords" content="contacto Muse, site Muse, formulário de contacto Muse">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- CSS próprio -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>

  <!-- NAVBAR -->
   <header>
    <nav class="navbar navbar-expand-lg navbar-dark bg-black fixed-top">
      <div class="container">
        <a href="index.html"><img src="assets/img/logo.png" alt="Logo Muse" width="100" class="logo"></a>
        
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
          <span class="navbar-toggler-icon"></span>
        </button>
        
        <div class="collapse navbar-collapse" id="menu">
          <ul class="navbar-nav ms-auto">
            <li class="nav-item"><a class="nav-link active" href="sobre.html">Sobre</a></li>
            <li class="nav-item"><a class="nav-link" href="albuns.html">Álbuns</a></li>
            <li class="nav-item"><a class="nav-link" href="tour.html">Tour</a></li>
            <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          </ul>
        </div>
      </div>
    </nav>
   </header>

<!-- CONTEÚDO -->
<main class="container my-5 pt-5">

  <!-- TÍTULO -->
  <div class="row mb-5">
    <div class="col-12 text-center">
      <h1>Contacto</h1>
      <p>Entre em contacto</p>
    </div>
  </div>

  <!-- GRID PRINCIPAL -->
  <div class="row">

    <!-- FORMULÁRIO (6 colunas) -->
    <div class="col-md-6">

      <form id="formContato" novalidate>

        <div class="mb-3">
          <label class="form-label">Nome</label>
          <input type="text" id="nome" class="form-control">
          <small class="text-danger" id="erroNome"></small>
        </div>

        <div class="mb-3">
          <label class="form-label">Apelido</label>
          <input type="text" id="apelido" class="form-control">
          <small class="text-danger" id="erroApelido"></small>
        </div>

        <div class="mb-3">
          <label class="form-label">Data de Nascimento</label>
          <input type="date" id="data" class="form-control">
          <small class="text-danger" id="erroData"></small>
        </div>

        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" id="email" class="form-control">
          <small class="text-danger" id="erroEmail"></small>
        </div>

        <div class="mb-3">
          <label class="form-label">Telefone</label>
          <input type="tel" id="telefone" class="form-control">
          <small class="text-danger" id="erroTelefone"></small>
        </div>

        <div class="mb-3">
          <label class="form-label">Mensagem</label>
          <textarea id="mensagem" class="form-control" rows="5"></textarea>
          <small class="text-danger" id="erroMensagem"></small>
        </div>

        <button type="submit" class="btn btn-muse w-100">Enviar</button>

        <div class="mt-3">
          <p id="sucesso" class="text-success fw-bold"></p>
        </div>

      </form>

    </div>

    <!-- IMAGEM COM OVERLAY (6 colunas) -->
     <div class="col-md-6 d-flex align-items-stretch">
      <div class="image-overlay">
        <img 
        src="assets/img/muse-contacto.webp" 
        alt="Muse show">
        <div class="overlay"></div>
      </div>
    </div>
  
  </div>

</main>

<!-- FOOTER -->
<footer>
  <div class="container">
    <div class="row align-items-center">

      <!-- Texto (6 colunas) -->
      <div class="col-md-6 text-center text-md-start">
        <p class="mb-0">© 2026 Muse Fan Website</p>
      </div>
      
      <!-- Redes sociais (6 colunas) -->
       <div class="col-md-6 text-center text-md-end">
        <a href="https://www.instagram.com/muse" target="_blank" class="social-icon">
          <i class="fab fa-instagram"></i>
        </a>

        <a href="https://x.com/muse" target="_blank" class="social-icon">
          <i class="fab fa-x-twitter"></i>
        </a>

        <a href="https://www.youtube.com/muse" target="_blank" class="social-icon">
          <i class="fab fa-youtube"></i>
        </a>

        <a href="https://open.spotify.com/artist/12Chz98pHFMPJEknJQMWvI" target="_blank" class="social-icon">
          <i class="fab fa-spotify"></i>
        </a>
      </div>
    </div>
  </div>
</footer>

<!-- JavaScript -->
<script src="assets/js/script.js"></script>

</body>
</html>
